service_name: llm-gateway

# Leave empty to disable caller auth (dev). Set GATEWAY_API_KEY in production.
api_keys:
  - ${GATEWAY_API_KEY:-}

database_url: data/gateway.db
structured_output_retries: 1

retry:
  max_attempts_per_route: 3
  base_delay_seconds: 0.25
  max_delay_seconds: 4
  retry_statuses: [408, 409, 429, 500, 502, 503, 504]

circuit_breaker:
  failure_threshold: 5
  cooldown_seconds: 30

rate_limit:
  enabled: true
  requests_per_minute: 60
  burst: 10

# Persisting model output is off by default (privacy).
stream_checkpoint:
  enabled: false
  flush_interval_seconds: 1
  max_chars: 200000

# Background sweep deletes rows past their TTL so the DB stays bounded
# (checkpoints can otherwise accumulate one permanently-growing row per stream).
retention:
  enabled: true
  checkpoint_ttl_hours: 24
  usage_event_ttl_days: 90
  sweep_interval_seconds: 3600

providers:
  deepseek:
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY:-}
    timeout_seconds: 120
  deepseek_backup:
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_BACKUP_API_KEY:-}
    timeout_seconds: 120
  openai:
    base_url: https://api.openai.com
    api_key: ${OPENAI_API_KEY:-}
    enabled: false
    timeout_seconds: 120
  # Second upstream protocol: Anthropic Messages. The gateway translates it to
  # the canonical OpenAI shape, so callers still use /v1/chat/completions.
  anthropic:
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY:-}
    dialect: anthropic
    api_version: "2023-06-01"
    timeout_seconds: 120

models:
  general-primary:
    strategy: priority
    routes:
      - provider: deepseek
        model: deepseek-v4-flash
        api: both
      - provider: deepseek_backup
        model: deepseek-chat
        api: both

  # Demo of the two upstream protocols:
  # DeepSeek v4 pro is served through the OpenAI Responses API...
  deepseek-v4-pro:
    strategy: priority
    routes:
      - provider: deepseek
        model: deepseek-v4-pro
        api: responses

  # ...while Claude is served through the Anthropic Messages API.
  claude-sonnet:
    strategy: priority
    routes:
      - provider: anthropic
        model: claude-sonnet-4-5
        api: chat

# USD per 1M tokens.
pricing:
  deepseek-v4-flash:
    input_per_million: 1.0
    output_per_million: 4.0
  deepseek-chat:
    input_per_million: 0.8
    output_per_million: 3.2
  deepseek-v4-pro:
    input_per_million: 1.2
    output_per_million: 5.0
  claude-sonnet-4-5:
    input_per_million: 3.0
    output_per_million: 15.0
    cached_input_per_million: 0.3

